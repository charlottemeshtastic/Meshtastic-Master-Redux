name: Update a community
description: Add or correct a country's local group entry.
title: "[Community] "
body:
  - type: input
    id: name
    attributes:
      label: Group name
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Country and region
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Public contact links and evidence
      description: Include the canonical website, public invite/contact channels and check date. Avoid exact private node locations.
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Change requested
      options:
        - Add a group
        - Correct a name or location
        - Replace a contact link
        - Mark as historical or remove
    validations:
      required: true
