name: Check current resource links
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-link-check
  cancel-in-progress: false
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 scripts/check_links.py --output work/link-checks
      - name: Publish check summary
        if: always()
        run: |
          if [ -f work/link-checks/report.md ]; then
            cat work/link-checks/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: resource-link-report
          path: work/link-checks/
          if-no-files-found: warn
          retention-days: 30
